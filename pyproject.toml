[project]
name = "yefees-recorder"
version = "0.1.0"
description = "Cross-platform screen recorder CLI built on mpv"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["screen-recording", "screencast", "ffmpeg", "cli"]
classifiers = [
    # No "License ::" classifier: PEP 639 forbids pairing one with a license expression.
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video :: Capture",
]
authors = [
    { name = "yefee8", email = "yavuzefefindikli8@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pyaudiowpatch>=0.2.12.8; sys_platform == 'win32'",
    "platformdirs>=4.11.12",
    "tomli>=2.4.1 ; python_full_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/Yefee8/yefees-recorder"
Repository = "https://github.com/Yefee8/yefees-recorder"
Issues = "https://github.com/Yefee8/yefees-recorder/issues"

[project.scripts]
yefees-recorder = "yefees_recorder.cli:app"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]
